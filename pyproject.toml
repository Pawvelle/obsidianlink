[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidianlink"
version = "0.1.0"
description = "A MineDojo-based Minecraft embodied-agent research project."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Private research project"}
authors = [{name = "ObsidianLink contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["obsidianlink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
